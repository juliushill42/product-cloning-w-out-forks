<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Cloning Without Forks</title><style>body{margin:0;background:#090c11;color:#f3f6fb;font:14px system-ui}main{max-width:1100px;margin:auto;padding:26px}.head{display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#111722;border:1px solid #29354a;border-radius:16px;padding:16px}textarea{width:100%;height:460px;box-sizing:border-box;background:#080c13;color:#d3e1ff;border:1px solid #303b50;border-radius:10px;padding:10px;font:12px monospace}button{padding:10px 14px;border:0;border-radius:9px;font-weight:700}pre{white-space:pre-wrap;word-break:break-word}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class=head><div><h1>Product Cloning Without Forks</h1><p>Independent product reconstruction from explicit behavior and interface contracts.</p></div><code>":"</code></div><div class=grid><section class=card><textarea id=bp></textarea><button id=check>Validate blueprint</button></section><section class=card><pre id=out>ready</pre></section></div></main><script>const sample={name:'Board Lite',slug:'board-lite',description:'Minimal task board',state:{},pages:[{path:'/',title:'Board',blocks:[{type:'text',text:'Independent generated product'},{type:'link',text:'Open About',target:'/about'}]},{path:'/about',title:'About',blocks:[{type:'text',text:'Generated from a behavioral blueprint.'},{type:'link',text:'Back',target:'/'}]}],endpoints:[{method:'GET',path:'/api/health',status:200,response:{ok:true}}]};bp.value=JSON.stringify(sample,null,2);check.onclick=async()=>{const r=await fetch('/api/validate',{method:'POST',headers:{'content-type':'application/json'},body:bp.value});out.textContent=await r.text()}</script></body></html>
